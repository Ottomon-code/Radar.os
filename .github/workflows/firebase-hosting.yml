name: Auto-Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build & Publish to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          node -e "require.resolve('react-is')" || npm install --no-save --legacy-peer-deps react-is@^19.3.1

      - name: TypeScript Verification
        run: npm run lint

      - name: Build Production Bundle
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Error: FIREBASE_TOKEN secret is missing in GitHub repository settings!"
            echo "Please add FIREBASE_TOKEN under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npx --yes firebase-tools deploy --only hosting --project gen-lang-client-0212017392 --token "$FIREBASE_TOKEN"
