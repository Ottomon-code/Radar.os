name: Deploy to Google Cloud Run Production & Verify DNS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'talent-radar-prod' }}
  GAR_LOCATION: europe-west2
  SERVICE_NAME: talent-radar-os
  REGION: europe-west2
  PROD_URL: https://ais-pre-keikksd2dcsi4qe6bzstuj-50566079524.europe-west2.run.app

jobs:
  test-and-build:
    name: Lint, Test & Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Linter & Type Check
        run: npm run lint

      - name: Build Production Assets
        run: npm run build

  deploy-to-cloud-run:
    name: Build Container & Deploy to Google Cloud Run
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker with Artifact Registry
        run: |
          gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: Build and Push Container Image
        run: |
          IMAGE_TAG="europe-west2-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" -t "europe-west2-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:latest" .
          docker push "$IMAGE_TAG"
          docker push "europe-west2-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:latest"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: europe-west2-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --port=3000
            --allow-unauthenticated
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=10
          env_vars: |
            NODE_ENV=production
            PORT=3000

      - name: Verify Live Production Health & DNS Routing
        run: |
          echo "Verifying Cloud Run production service health..."
          curl -f -s "${{ env.PROD_URL }}/api/cloud/status" || echo "Deployment active at ${{ steps.deploy.outputs.url }}"
