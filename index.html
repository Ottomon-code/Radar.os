    <!-- Dev Guard: Pre-Vite WebSocket stub & harmless disconnect suppression -->
    <script>
      (function(){
        if (typeof window === 'undefined') return;
        var OWS = window.WebSocket;
        if (OWS) {
          window.WebSocket = function(url, proto) {
            var isHmr = false;
            try {
              var u = String(url || '');
              if (proto === 'vite-hmr' || (Array.isArray(proto) && proto.indexOf('vite-hmr') !== -1) || u.indexOf('token=') !== -1 || u.indexOf('/@vite') !== -1 || u.indexOf('vite-hmr') !== -1) {
                isHmr = true;
              }
            } catch (_) {}
            if (isHmr) {
              var L = {};
              var d = {
                url: String(url),
                readyState: 1,
                protocol: 'vite-hmr',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function() {},
                close: function(c, r) {
                  d.readyState = 3;
                  var ev = { type: 'close', wasClean: true, code: c || 1000, reason: r || 'Normal closure' };
                  (L['close'] || []).forEach(function(fn) { try { fn(ev); } catch (_) {} });
                },
                addEventListener: function(t, fn) {
                  if (!L[t]) L[t] = [];
                  L[t].push(fn);
                  if (t === 'open') {
                    setTimeout(function() { try { fn({ type: 'open', target: d }); } catch (_) {} }, 0);
                  }
                },
                removeEventListener: function(t, fn) {
                  if (L[t]) { L[t] = L[t].filter(function(cb) { return cb !== fn; }); }
                },
                dispatchEvent: function(e) {
                  (L[e.type] || []).forEach(function(fn) { try { fn(e); } catch (_) {} });
                  return true;
                }
              };
              setTimeout(function() {
                if (typeof d.onopen === 'function') {
                  try { d.onopen({ type: 'open', target: d }); } catch (_) {}
                }
              }, 0);
              return d;
            }
            return new OWS(url, proto);
          };
          window.WebSocket.prototype = OWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        var oErr = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var txt = args.map(function(a) {
            if (!a) return '';
            if (a instanceof Error) return (a.message || '') + ' ' + (a.stack || '');
            return String(a);
          }).join(' ');
          if (txt.indexOf('WebSocket closed without opened') !== -1 || (txt.indexOf('[vite]') !== -1 && txt.indexOf('websocket') !== -1)) {
            return;
          }
          return oErr.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason;
          var m = (r && (r.message || String(r))) || '';
          if (m.indexOf('WebSocket') !== -1 || m.indexOf('vite') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          var m = (e.message || '') + '';
          if (m.indexOf('WebSocket') !== -1 || m.indexOf('vite') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
