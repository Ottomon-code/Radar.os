<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#152330" />
      <stop offset="70%" stop-color="#0f1720" />
      <stop offset="100%" stop-color="#070b0e" />
    </radialGradient>
    <linearGradient id="emerald-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3a5" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3a5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#22d3a5" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bg-glow)" />
  <rect width="512" height="512" rx="104" fill="none" stroke="#22d3a5" stroke-width="6" stroke-opacity="0.4" />

  <!-- Tactical Radar Rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#1e2b36" stroke-width="4" stroke-dasharray="10 8" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="#22d3a5" stroke-width="3" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="96" fill="none" stroke="#22d3a5" stroke-width="3" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="44" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6" />

  <!-- Coordinate Crosshairs -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#22d3a5" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="6 6" />
  <line x1="40" y1="256" x2="472" y2="256" stroke="#22d3a5" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="6 6" />

  <!-- Radar Sweep Sector -->
  <path d="M 256 256 L 397 115 A 200 200 0 0 0 256 56 Z" fill="url(#sweep)" />
  <line x1="256" y1="256" x2="397" y2="115" stroke="#22d3a5" stroke-width="4" stroke-linecap="round" />

  <!-- Target Blips -->
  <circle cx="340" cy="180" r="10" fill="#22d3a5" />
  <circle cx="340" cy="180" r="18" fill="none" stroke="#22d3a5" stroke-width="2" stroke-opacity="0.6" />
  
  <circle cx="170" cy="310" r="7" fill="#38bdf8" />
  <circle cx="370" cy="340" r="6" fill="#fbbf24" />
  <circle cx="160" cy="170" r="5" fill="#a78bfa" />

  <!-- Center Core Node -->
  <circle cx="256" cy="256" r="18" fill="url(#emerald-cyan)" />
  <circle cx="256" cy="256" r="28" fill="none" stroke="#22d3a5" stroke-width="3" stroke-opacity="0.7" />
  <circle cx="256" cy="256" r="8" fill="#ffffff" />
</svg>
